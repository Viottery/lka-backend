{
  "suite_id": "capabilities",
  "description": "Direct runtime health and capability catalog benchmark.",
  "cases": [
    {
      "case_id": "health_contract",
      "operation": "health",
      "request": {"user_input": "Check health."},
      "expect": {
        "output_contains_all": ["local-knowledge-agent-os", "0.1.0", "ok"],
        "max_wall_time_ms": 2000
      }
    },
    {
      "case_id": "capability_catalog_contract",
      "operation": "capabilities",
      "request": {"user_input": "List capabilities."},
      "expect": {
        "capabilities_include": ["mail", "matter", "filesystem", "summarize_folder", "claude_code", "codex"],
        "output_contains_all": ["tool_package", "native_skill", "expert_tool"],
        "max_wall_time_ms": 2000
      }
    }
  ]
}
