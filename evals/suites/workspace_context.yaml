{
  "suite_id": "workspace_context",
  "description": "Direct runtime workspace index benchmark with isolated local fixture.",
  "cases": [
    {
      "case_id": "simple_project_workspace_index",
      "operation": "workspace_index",
      "params": {
        "workspace_fixture": "simple_project",
        "source_frontend": "linux-native",
        "options": {
          "recursive": true,
          "skip_hidden": true,
          "allow_symlinks": false,
          "max_files": 100
        }
      },
      "request": {"user_input": "Index eval simple project workspace."},
      "expect": {
        "output_contains_all": ["workspace_id", "completed", "indexed_files", "indexed_chunks"],
        "workspace_min_files": 4,
        "workspace_min_chunks": 4,
        "max_wall_time_ms": 5000
      }
    }
  ]
}
