{
  "suite_id": "real_llm_hard_mail_tasks",
  "description": "Real-LLM benchmark: isolated virtual mailbox, real Agent route/decision/tool/answer, no scripted search query or scripted answer.",
  "cases": [
    {
      "case_id": "real_multi_deadline_digest_with_distractors",
      "name": "Real LLM aggregates student deadlines while ignoring unrelated urgent/scam/travel noise.",
      "workflow": "mail_qa",
      "llm_mode": "real",
      "setup": {"mail_fixtures": ["core_mailbox", "expanded_mailbox", "hard_mailbox"]},
      "request": {"user_input": "把接下来需要处理的学生事务 deadline 汇总一下，排除广告、诈骗和旅行信息。"},
      "expect": {
        "selected_package": "mail",
        "required_tools": ["mail.search", "mail.load_messages"],
        "answer_contains_all": ["2026-08-20", "2026-08-18", "2026-08-25", "2026-08-19"],
        "answer_excludes_all": ["refundable deposit", "flight departs", "bank password"],
        "evidence_external_ids": [
          "eval_ica_student_pass_checklist",
          "eval_course_deadline_reminder",
          "eval_scholarship_deadline",
          "eval_library_overdue_warning"
        ],
        "forbidden_evidence_external_ids": [
          "eval_phishing_urgent_bank",
          "eval_travel_itinerary_noise",
          "eval_noise_newsletter_weekly"
        ],
        "max_llm_calls": 12,
        "max_wall_time_ms": 60000,
        "requires_log": true
      }
    },
    {
      "case_id": "real_conflicting_thesis_defense_updates",
      "name": "Real LLM resolves conflicting update chain and avoids obsolete time/location.",
      "workflow": "mail_qa",
      "llm_mode": "real",
      "setup": {"mail_fixtures": ["hard_mailbox"]},
      "request": {"user_input": "Thesis defense 最终是什么时间地点？旧信息不要混进来。"},
      "expect": {
        "selected_package": "mail",
        "required_tools": ["mail.search", "mail.load_messages"],
        "answer_contains_all": ["2026-08-24", "10:30", "Room C", "2026-08-23 10:30"],
        "answer_excludes_all": ["Room A is the final room"],
        "evidence_external_ids": [
          "eval_thesis_defense_original",
          "eval_thesis_defense_room_change",
          "eval_thesis_defense_final_update"
        ],
        "max_llm_calls": 12,
        "max_wall_time_ms": 60000,
        "requires_log": true
      }
    },
    {
      "case_id": "real_finance_reimbursement_scam_filter",
      "name": "Real LLM selects legitimate finance instructions while rejecting near-duplicate scam.",
      "workflow": "mail_qa",
      "llm_mode": "real",
      "setup": {"mail_fixtures": ["hard_mailbox"]},
      "request": {"user_input": "Finance workshop reimbursement 要交什么？注意不要采信可疑邮件。"},
      "expect": {
        "selected_package": "mail",
        "required_tools": ["mail.search", "mail.load_messages"],
        "answer_contains_all": ["original receipt", "bank account proof", "claim form", "2026-08-26"],
        "answer_excludes_all": ["send your bank password", "one-time code"],
        "evidence_external_ids": ["eval_finance_workshop_actual"],
        "forbidden_evidence_external_ids": ["eval_finance_workshop_scam"],
        "max_llm_calls": 12,
        "max_wall_time_ms": 60000,
        "requires_log": true
      }
    },
    {
      "case_id": "real_capstone_multisource_to_matter",
      "name": "Real LLM creates one source-linked matter from two related Capstone emails while excluding promotion.",
      "workflow": "mail_to_matter",
      "llm_mode": "real",
      "setup": {"mail_fixtures": ["hard_mailbox"]},
      "request": {"user_input": "把 Capstone pitch 相关事项整理成一个本地事务，证据要关联邮件。"},
      "expect": {
        "selected_package": "mail",
        "required_tools": ["mail.search", "mail.load_messages", "matter.create"],
        "answer_contains_any": ["Capstone", "capstone", "事务", "matter"],
        "evidence_external_ids": [
          "eval_capstone_pitch_initial",
          "eval_capstone_pitch_rehearsal"
        ],
        "forbidden_evidence_external_ids": ["eval_capstone_noise_marketing"],
        "created_matter_contains": ["Capstone", "2026-08-22"],
        "matter_source_external_ids": [
          "eval_capstone_pitch_initial",
          "eval_capstone_pitch_rehearsal"
        ],
        "max_llm_calls": 14,
        "max_wall_time_ms": 60000,
        "requires_log": true
      }
    }
  ]
}
