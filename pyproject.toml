[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lka-backend"
version = "0.1.0"
description = "Local Knowledge Agent OS native Windows and Linux backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0,<0.22.0",
  "fastapi>=0.115.0",
  "fastembed>=0.8.0",
  "langgraph>=1.0.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlite-vec>=0.1.9",
  "socksio>=1.0.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[project.scripts]
lka = "debug_frontend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "debug_frontend"]

[tool.ruff]
line-length = 100
target-version = "py312"
