services:
  lka-api:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/app/data
      - /mnt/c/Users/chuan/Documents:/mnt/windows/Documents
      - /mnt/c/Users/chuan/Downloads:/mnt/windows/Downloads
      - /home/chuan/projects:/mnt/wsl/projects
    environment:
      - LKA_DATA_DIR=/app/data
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage

