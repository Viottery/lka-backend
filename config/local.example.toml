# Local Knowledge Agent OS local configuration template.
#
# Copy this file to config/local.toml and fill values locally.
# config/local.toml is intentionally ignored by git.
#
# Prefer *_env fields for secrets. For example, set OPENAI_API_KEY in your
# shell or .env, then reference it here as api_key_env = "OPENAI_API_KEY".
# Microsoft Graph client IDs are not secrets, so Outlook can use client_id
# directly or client_id_env for environment-variable based configuration.

[llm]
provider = "mock"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4.1-mini"
timeout_seconds = 60
default_client = ""
fallback_client = ""
default_response_mode = "json"
max_attempts = 2
# Optional legacy/default-client limits. Capacity and tokenizer apply only to
# this configured default model; use model_overrides for exact model names.
# context_window_tokens = 131072
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/model/tokenizer.json"
# [llm.model_overrides."your-model-id"]
# context_window_tokens = 131072
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/model/tokenizer.json"

[safety]
# Tool calls with read_only != true must always enter the safety review step.
# Modes:
# - skip: record the review and auto-approve it.
# - llm: ask the configured LLM to approve/reject.
# - manual: wait for frontend/user approval through /agent/safety-reviews/{id}/decision.
tool_review_mode = "skip"
manual_wait_poll_seconds = 0.5

[agent]
# Orchestration backend. Keep legacy during migration; langgraph enables the
# checkpointed graph runner while preserving the existing Agent semantics.
orchestrator = "legacy"
# Graph mode uses a separate local SQLite checkpoint database by default.
# Use memory only for disposable tests that do not need restart recovery.
checkpoint_backend = "sqlite"
# Maximum decision-loop steps after the initial route. Raise for longer workflows
# such as sync -> search -> load -> dedupe -> create/update -> verify -> answer.
max_decision_steps = 10
# Enable Planner fork operations and bounded DAG scheduling. This requires
# orchestrator = "langgraph" for parent checkpoint and approval resumption.
multi_agent_planning_enabled = false
# Demonstration-only expert that produces simulated workflow results. Keep off
# for ordinary user tasks; enabling it also permits Planner to select it.
mock_workflow_agent_enabled = false
# Read-only mail expert workflow. Does not automatically route user turns.
mail_expert_enabled = false
# External Codex worker is opt-in. It runs against a staged copy of one Git
# workspace; staged edits are not applied to the source workspace automatically.
codex_expert_enabled = false
# codex_binary_path = "/absolute/path/to/codex"
# codex_workspace_base = "/absolute/path/outside/source/workspaces"
# Optional: private Codex app-server SQLite state directory. When configured,
# it is created with private permissions and passed as a sqlite_home override.
# codex_state_home = "/absolute/path/outside/source/codex-state"
# Optional: isolated Codex profile directory. This overrides CODEX_HOME and
# requires separate local authentication for this profile; credentials are not copied.
# codex_home = "/absolute/path/outside/source/codex-profile"
# Current Codex CLI versions use a per-process restricted-read permissions
# profile. Use "legacy" only with a CLI that supports readOnlyAccess in turn/start.
codex_permission_mode = "profile"
# codex_model = "your-authorized-codex-model"
# codex_reasoning_effort = "medium"
# Opt in to single-agent fast-path policy telemetry. No ReAct/Planner LLM step
# is skipped; explicit Planner fork requests record an upgrade before normal
# scheduling. Context-answer/retrieval templates remain unavailable until
# trusted selection and evidence contracts are configured.
fast_path_single_agent_enabled = false
max_fork_depth = 2
max_children = 8
max_fork_size = 4
# Maximum child DAG steps executing at once, and retry attempts after a
# retryable child failure. Retries are bounded per step.
multi_agent_max_concurrency = 2
# Process-wide cap across concurrent multi-Agent plans.
multi_agent_global_max_concurrency = 8
multi_agent_max_retries = 1

# Optional named clients. Keep commented until configured locally.
# [[llm.clients]]
# name = "mock"
# provider = "mock"
# default_model = "mock"
# available_models = ["mock"]
# context_window_tokens = 131072
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/model/tokenizer.json"
# [llm.clients.model_overrides."another-model-id"]
# context_window_tokens = 65536
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/another/tokenizer.json"
# supports_stream = true
# supports_json_mode = true
# supports_function_calling = true
# Set true only when this endpoint accepts tool_choice = "required".
# supports_required_tool_choice = false
# Set this only when the configured provider/base URL supports strict function schemas.
# function_calling_strict = false
# Set true only for endpoints that accept a reasoning_effort chat-completions field.
# supports_reasoning_effort = false
# thinking_control = "deepseek" # Opt-in only when the endpoint supports thinking.type.
#
# [[llm.clients]]
# name = "openai"
# provider = "openai_compatible"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# default_model = "gpt-4.1-mini"
# available_models = ["gpt-4.1-mini", "gpt-4.1"]
# timeout_seconds = 180
# supports_stream = true
# supports_json_mode = true

[mail.outlook]
# This is a hard switch: false disables startup, background, API, and Agent tool sync.
enabled = false
auth_method = "device_code"
client_id = ""
client_id_env = "MS_GRAPH_CLIENT_ID"
tenant_id = "consumers"
scopes = ["User.Read", "Mail.Read", "offline_access"]
token_store_path = "./data/runtime/secrets/outlook_token.json"
sync_folder = "Inbox"
download_attachment_content = false
startup_sync_enabled = true
background_sync_enabled = true
sync_interval_seconds = 300
sync_limit = 25
sync_max_pages = 1

[mail.imap]
enabled = false
host = ""
port = 993
username = ""
password_env = "MAIL_IMAP_PASSWORD"
use_ssl = true

[embedding]
# All document content stays local: FastEmbed generates vectors locally and
# sqlite-vec persists/searches them inside the local SQLite database.
enabled = true
provider = "fastembed"
index_provider = "sqlite_vec"
model_name = "BAAI/bge-small-zh-v1.5"
dimensions = 512
device = "auto"
cache_dir = "./data/runtime/models"
batch_size = 16
normalize_embeddings = true
query_prefix = "为这个句子生成表示以用于检索相关文章："
# Start with measured lexical behavior; enable hybrid after corpus/language eval.
default_retrieval_mode = "keyword"
# Use POST /knowledge/semantic-index/sync for existing content. Enabling this
# makes future imports synchronously embed their new non-secret chunks.
auto_index_on_import = false
# Avoid any network access while serving queries. The first model download must
# be requested explicitly through semantic-index sync.
local_files_only = true

[query_rewrite]
# Per knowledge.search call: original query plus at most max_rewrites alternatives.
# Retrieval fans out with bounded parallelism, then fuses and reranks once.
max_rewrites = 8
max_total_chars = 2400
max_parallel_searches = 4
max_total_candidates = 240

[web_search]
# Read-only public web/news search. Set BRAVE_SEARCH_API_KEY in your shell or
# .env; without it web.search reports unavailable. web.open needs no API key.
provider = "brave"
api_key_env = "BRAVE_SEARCH_API_KEY"
# Conservative local cap, below Brave's current $5 monthly Search credit at
# $5/1,000 requests. Set 0 to disable paid searches entirely.
monthly_request_limit = 900
# Immutable readable-text snapshots are retained for a day; URL reads reuse
# at most 5-minute-old snapshots. Explicit snapshot_id reads do not refetch.
snapshot_ttl_seconds = 86400
page_max_age_seconds = 300
cache_max_entries = 256
cache_max_bytes = 64000000
page_preview_chars = 2400
search_snippet_chars = 360
max_parallel_requests = 4
max_pending_requests = 16
request_timeout_seconds = 12

[memory]
# Local memory store and scoped recall are enabled by default. Background
# local extraction learns explicit "记住：..." requests and tightly scoped,
# low-impact enduring preferences such as "我希望以后...". Enabling this
# subsystem authorizes background processing of the conversation. Remote
# extraction is a separate cost/quality option. Raw messages stay out of jobs.
enabled = true
background_enabled = true
# Use the configured LLM to consider less explicit long-term memories. This
# increases background model calls; it is not an additional consent switch.
allow_remote_extraction = false
max_recalled_items = 8
max_recalled_chars = 2400
extraction_debounce_seconds = 5
background_worker_count = 2
max_job_tokens = 32768
generation_output_tokens = 4096 # Includes reasoning and final output, not summary size.
recovery_output_tokens = 8192 # One bounded recovery; thinking disabled when supported.
# Optional separate low-cost route; must declare its context_window_tokens.
# background_client_name = "background"
# background_model = "your-configured-model"

[background]
request_timeout_seconds = 30
max_pending_jobs = 1024
max_llm_concurrency = 4
interactive_reserved = 2
memory_concurrency = 1
io_concurrency = 1
hourly_token_limit = 200000
daily_token_limit = 1000000
# Monetary limits are opt-in, with configured prices; usage always records tokens.
daily_cost_limit = 0
input_cost_per_million = 0
output_cost_per_million = 0

[reranker]
# Rerank the locally recalled candidate pool before selecting top-k. Keep
# local_files_only=true: a missing model falls back to retrieval order with a warning.
# Download the model explicitly to cache_dir before deployment for full quality.
enabled = true
model_name = "BAAI/bge-reranker-base"
cache_dir = "./data/runtime/models"
batch_size = 8
max_candidates = 30
max_query_chars = 1000
max_candidate_chars = 1800
max_concurrent_inferences = 1
queue_timeout_ms = 25
local_files_only = true
