# Local Knowledge Agent OS local configuration template.
#
# Copy this file to config/local.toml and fill values locally.
# config/local.toml is intentionally ignored by git.
#
# Prefer *_env fields for secrets. For example, set OPENAI_API_KEY in your
# shell or .env, then reference it here as api_key_env = "OPENAI_API_KEY".
# Windows paths: use forward slashes ("C:/Users/name/project") or TOML literal
# strings ('C:\Users\name\project'); double-quoted backslashes need escaping.
# Microsoft Graph client IDs are not secrets, so Outlook can use client_id
# directly or client_id_env for environment-variable based configuration.

[management]
# Management tools and durable task dispatch. Autonomous turns are separately opt-in.
enabled = false
autonomous_enabled = false
# Enable only after all clients understand visibility and rebuild their Matter cache.
internal_items_enabled = false
# Accepted agent tasks dispatch independently; no fixed management worker pool.
poll_seconds = 5
min_wake_interval_seconds = 60
# One unified background sweep of active attention goals; no per-goal timer needed.
# Zero disables periodic sweeps while retaining task/timer event handling.
attention_sweep_interval_seconds = 1800
max_causal_rounds = 6
failure_limit = 3
# Optional management-specific limits are unset by default. Existing frozen
# allowances and usage ledgers survive restart/resume/replacement unchanged.
# max_daily_rounds = 12
# manager_max_calls = 300
# manager_max_tokens = 2000000
# goal_max_calls = 100
# goal_max_tokens = 500000
# execution_max_calls = 24
# execution_max_tokens = 200000

[llm]
provider = "mock"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4.1-mini"
# Models served by the same endpoint may require different wire protocols.
# available_models = ["gpt-4.1-mini", "another-model-id"]
# api_protocol = "chat_completions" # Or "responses" for the entire client.
# model_api_protocol_overrides = { "another-model-id" = "responses" }
# These protocol fields also apply within each [[llm.clients]] table.
# Declare controls only after verifying this exact endpoint/default model.
# supports_reasoning_effort = true
# reasoning_effort_map = { off = "none", low = "low", high = "high", max = "xhigh" }
# thinking_control = "deepseek"
timeout_seconds = 60
default_client = ""
fallback_client = ""
default_response_mode = "json"
max_attempts = 2
# Image input is opt-in and must be verified on the configured endpoint/model.
# supports_vision = false
# vision_model_overrides = { "your-vision-model" = true }
# Explicit audio attachments temporarily select this client/model for one turn.
# audio_client = "your-client-name" # Omit to use the default client endpoint/key.
# audio_model = "gemini-3.8-flash"
# audio_model_overrides = { "gemini-3.8-flash" = true }
# supports_audio = false # Enable globally only for an audio-only client.
# Optional legacy/default-client limits. Capacity and tokenizer apply only to
# this configured default model; use model_overrides for exact model names.
# context_window_tokens = 131072
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/model/tokenizer.json"
# [llm.model_overrides."your-model-id"]
# context_window_tokens = 131072
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/model/tokenizer.json"

[safety]
# Every Agent tool call, including read-only calls, enters the safety review step.
# Modes:
# - skip: record the review and auto-approve it.
# - llm: ask the configured LLM to approve/reject.
# - manual: wait for frontend/user approval through /agent/safety-reviews/{id}/decision.
tool_review_mode = "skip"
manual_wait_poll_seconds = 0.5

[agent]
# Final-answer network waiting limit; other model stages retain their provider limits.
answer_timeout_seconds = 60
# Before any stream output, a timeout may switch once to a compatible configured model.
answer_timeout_fallback_enabled = true
# Orchestration backend. Keep legacy during migration; langgraph enables the
# checkpointed graph runner while preserving the existing Agent semantics.
orchestrator = "legacy"
# Graph mode uses a separate local SQLite checkpoint database by default.
# Use memory only for disposable tests that do not need restart recovery.
checkpoint_backend = "sqlite"
# Maximum decision-loop steps after the initial route. Raise for longer workflows
# such as sync -> search -> load -> dedupe -> create/update -> verify -> answer.
max_decision_steps = 32
# Optional supported-client decision-stage thinking override, not route/answer/review.
# Leave unset to retain provider defaults and existing recovery behavior.
# decision_thinking_enabled = false
# Enable Planner fork operations and bounded DAG scheduling. This requires
# orchestrator = "langgraph" for parent checkpoint and approval resumption.
multi_agent_planning_enabled = false
# Demonstration-only expert that produces simulated workflow results. Keep off
# for ordinary user tasks; enabling it also permits Planner to select it.
mock_workflow_agent_enabled = false
# Read-only mail expert workflow. Does not automatically route user turns.
mail_expert_enabled = false
# External Codex worker is opt-in. It runs against a staged copy of one Git
# workspace; staged edits are not applied to the source workspace automatically.
codex_expert_enabled = false
# codex_binary_path = "/absolute/path/to/codex"
# Windows must point to the native executable, e.g. "C:/Tools/Codex/codex.exe".
# .cmd, .bat and .ps1 launchers are rejected; install/authenticate Codex separately.
# codex_workspace_base = "/absolute/path/outside/source/workspaces"
# Optional: private Codex app-server SQLite state directory. When configured,
# it is created with private permissions and passed as a sqlite_home override.
# codex_state_home = "/absolute/path/outside/source/codex-state"
# Optional: isolated Codex profile directory. This overrides CODEX_HOME and
# requires separate local authentication for this profile; credentials are not copied.
# codex_home = "/absolute/path/outside/source/codex-profile"
# Current Codex CLI versions use a per-process restricted-read permissions
# profile. Use "legacy" only with a CLI that supports readOnlyAccess in turn/start.
codex_permission_mode = "profile"
# codex_model = "your-authorized-codex-model"
# codex_reasoning_effort = "medium"
# Opt in to single-agent fast-path policy telemetry. No ReAct/Planner LLM step
# is skipped; explicit Planner fork requests record an upgrade before normal
# scheduling. Context-answer/retrieval templates remain unavailable until
# trusted selection and evidence contracts are configured.
fast_path_single_agent_enabled = false
max_fork_depth = 2
max_children = 8
max_fork_size = 4
# Maximum child DAG steps executing at once, and retry attempts after a
# retryable child failure. Retries are bounded per step.
multi_agent_max_concurrency = 2
# Process-wide cap across concurrent multi-Agent plans.
multi_agent_global_max_concurrency = 8
multi_agent_max_retries = 1

# Optional named clients. Keep commented until configured locally.
# [[llm.clients]]
# name = "mock"
# provider = "mock"
# default_model = "mock"
# available_models = ["mock"]
# context_window_tokens = 131072
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/model/tokenizer.json"
# [llm.clients.model_overrides."another-model-id"]
# context_window_tokens = 65536
# output_reserve_tokens = 8192
# tokenizer_json_path = "./data/tokenizers/another/tokenizer.json"
# supports_stream = true
# supports_json_mode = true
# supports_function_calling = true
# Enable only after verifying image input on this exact endpoint/model.
# supports_vision = false
# Mixed-model clients can declare exact capability overrides:
# vision_model_overrides = { "your-vision-model" = true, "your-text-model" = false }
# Set true only when this endpoint accepts tool_choice = "required".
# supports_required_tool_choice = false
# Set this only when the configured provider/base URL supports strict function schemas.
# function_calling_strict = false
# Set true only for endpoints that accept a reasoning_effort chat-completions field.
# supports_reasoning_effort = false
# supports_reasoning_off = false
# reasoning_effort_map = { off = "none", low = "low", high = "high", max = "xhigh" }
# thinking_control = "deepseek" # Opt-in only when the endpoint supports thinking.type.
# Additional models require exact capability declarations; max may alias high.
# [llm.clients.model_reasoning_overrides."another-model-id"]
# supports_off = false
# effort_map = { low = "low", high = "high", max = "high" }
#
# [[llm.clients]]
# name = "openai"
# provider = "openai_compatible"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# default_model = "gpt-4.1-mini"
# available_models = ["gpt-4.1-mini", "gpt-4.1"]
# timeout_seconds = 180
# supports_stream = true
# supports_json_mode = true

[mail.outlook]
# This is a hard switch: false disables startup, background, API, and Agent tool sync.
enabled = false
auth_method = "device_code"
client_id = ""
client_id_env = "MS_GRAPH_CLIENT_ID"
tenant_id = "consumers"
scopes = ["User.Read", "Mail.Read", "offline_access"]
token_store_path = "./data/runtime/secrets/outlook_token.json"
sync_folder = "Inbox"
download_attachment_content = false
startup_sync_enabled = true
background_sync_enabled = true
sync_interval_seconds = 300
sync_limit = 25
sync_max_pages = 1

[mail.imap]
enabled = false
host = ""
port = 993
username = ""
password_env = "MAIL_IMAP_PASSWORD"
use_ssl = true

[embedding]
# All document content stays local: FastEmbed generates vectors locally and
# sqlite-vec persists/searches them inside the local SQLite database.
enabled = true
provider = "fastembed"
index_provider = "sqlite_vec"
model_name = "BAAI/bge-small-zh-v1.5"
dimensions = 512
device = "auto"
cache_dir = "./data/runtime/models"
batch_size = 16
normalize_embeddings = true
query_prefix = "为这个句子生成表示以用于检索相关文章："
# Start with measured lexical behavior; enable hybrid after corpus/language eval.
default_retrieval_mode = "keyword"
# Use POST /knowledge/semantic-index/sync for existing content. Enabling this
# makes future imports synchronously embed their new non-secret chunks.
auto_index_on_import = false
# Avoid any network access while serving queries. The first model download must
# be requested explicitly through semantic-index sync.
local_files_only = true

# Optional personal cloud instance. Accounts are trusted coadministrators of ONE
# shared dataset; this is not multi-tenant isolation. Bootstrap through the CLI.
[auth]
enabled = false
require_https = true
secure_cookie = true
allowed_origins = [] # Exact frontend origins, e.g. https://host.example-tailnet.ts.net
session_ttl_seconds = 43200
allow_bearer_sessions = false # Explicit opt-in for native/API clients.
login_max_attempts = 5
login_window_seconds = 900

[devices]
enabled = false # Requires auth.enabled. Registration grants scopes explicitly.
online_threshold_seconds = 90

[sync]
enabled = false
role = "hub" # Or "replica" for an independent, read-only materialization.
# Replica mode requires both values and management.enabled=false.
# hub_url = "https://host.example-tailnet.ts.net"
# hub_id = "hub_id_read_from_the_authenticated_hub"
token_env = "LKA_NODE_TOKEN"
poll_seconds = 15
page_size = 100
request_timeout_seconds = 10
max_page_bytes = 1048576
memory_cache_stale_seconds = 60 # Informational; stale reads remain available offline.
memory_project_bindings = {} # Explicit local memory project ID -> hub project ID.
memory_write_enabled = false # Human-confirmed versioned writes; devices need sync.memory.write.
memory_aggregation_enabled = false # Trusted backend memory replication + dedup; sync.memory.aggregate required.

[connections]
enabled = false
# Hub: enable with auth/devices/sync hub; no node_id required.
# Replica: set node_id, HTTPS origin and locally approved workspace mappings.
node_id = ""
allowed_origins = []
workspace_roots = {} # Example: { work = "/home/me/work" }; never copy another node's paths.
workspace_mounts = {} # Linux native mounts: ID -> expected_filesystem/expected_source/read_only.
grant_ttl_seconds = 120
session_ttl_seconds = 2592000
allow_native = true

[remote_execution]
enabled = false
# Replica requires connections.enabled and a registered environment_id.
# environment_id = "linux"
workspace_mappings = {} # Same workspace ID must match connections.workspace_roots.
allowed_tools = [] # Explicit node-local execution grant. Empty grants no tools.
shell_trust = "disabled" # "host_user" acknowledges native OS-user access; bash.run + manual approval required.
poll_seconds = 3
lease_seconds = 90
max_task_bytes = 1048576

[query_rewrite]
# Per knowledge.search call: original query plus at most max_rewrites alternatives.
# Retrieval fans out with bounded parallelism, then fuses and reranks once.
max_rewrites = 8
max_total_chars = 2400
max_parallel_searches = 4
max_total_candidates = 240

[web_search]
# Read-only public web/news search. Set BRAVE_SEARCH_API_KEY in your shell or
# .env; without it web.search reports unavailable. web.open needs no API key.
provider = "brave"
api_key_env = "BRAVE_SEARCH_API_KEY"
# Conservative local cap, below Brave's current $5 monthly Search credit at
# $5/1,000 requests. Set 0 to disable paid searches entirely.
monthly_request_limit = 900
# Immutable readable-text snapshots are retained for a day; URL reads reuse
# at most 5-minute-old snapshots. Explicit snapshot_id reads do not refetch.
snapshot_ttl_seconds = 86400
page_max_age_seconds = 300
cache_max_entries = 256
cache_max_bytes = 64000000
page_preview_chars = 2400
search_snippet_chars = 360
max_parallel_requests = 4
max_pending_requests = 16
request_timeout_seconds = 12

[memory]
atomic_context_mode = "off" # off | shadow (background records only) | active (prompt projection)
atomic_context_input_tokens = 24000 # Whole-message background input budget; never clips source history.
atomic_context_projection_tokens = 4096
atomic_context_debounce_seconds = 30
# Local memory store and scoped recall are enabled by default. Background
# local extraction learns explicit "记住：..." requests and tightly scoped,
# low-impact enduring preferences such as "我希望以后...". Enabling this
# subsystem authorizes background processing of the conversation. Remote
# extraction is a separate cost/quality option. Raw messages stay out of jobs.
enabled = true
background_enabled = true
# Use the configured LLM to consider less explicit long-term memories. This
# increases background model calls; it is not an additional consent switch.
allow_remote_extraction = true
extraction_context_messages = 12
extraction_context_chars = 12000
auto_publish_min_confidence = 0.85
reconciliation_max_items = 48 # Related old memories, not only the most recent entries.
reconciliation_max_chars = 16000 # Shared global/project candidate view; never cut a condition.
consolidation_enabled = true
consolidation_debounce_seconds = 60
consolidation_interval_seconds = 21600 # Periodic safety-net check every six hours.
consolidation_batch_items = 24
consolidation_min_confidence = 0.9
max_recalled_items = 8
max_recalled_chars = 2400
extraction_debounce_seconds = 5
background_worker_count = 2
max_job_tokens = 0 # No ordinary memory/compaction allowance; emergency fuses below still apply.
compaction_timeout_seconds = 180 # Per-call fallback deadline; provider timeout also applies.
generation_output_tokens = 4096 # Extraction/consolidation output cap; compaction does not send a cap.
recovery_output_tokens = 8192 # One bounded recovery; thinking disabled when supported.
# Optional separate low-cost route; must declare its context_window_tokens.
# background_client_name = "background"
# background_model = "your-configured-model"

[message_history]
max_recovery_restarts = 1 # same family/budget; archived checkpoint, no silent skipping
fragment_recovery_enabled = false # Opt-in one repair per fragment, still charged to the same work budget.
reading_algorithm = "legacy" # compact/selected require explicit per-source analysis consent
message_encoding = "records" # compact_records shares metadata defaults; id/sender/text stay inline. Checkpoints keep encoding.
reading_output_style = "standard" # concise reduces repetition for new compact/selected work; checkpoints keep their style.
concise_output_tokens = 8192 # Generation/recovery cap for concise style, reserved in the same work/service budgets.
selector_algorithm = "current" # multi_lane is an experimental selector for selected reading.
selector_rollout_percent = 0 # Stable percentage of new work families; 0 disables the experimental selector.
participant_pool_capacity = 30
participant_pinned_capacity = 10
profile_cold_days = 14
profile_retention_days = 30
selector_max_messages = 40
selector_exploration_fraction = 0.1
schema_version = 1 # Local configuration schema, distinct from message import v1/v2.
# No message is imported without an explicit per-conversation whitelist.
# Recording and model analysis are separate policy switches; analysis defaults off.
enabled = true
background_enabled = true
worker_count = 1
max_job_tokens = 32768 # Cumulative family allowance: retries/restarts cannot reset it.
max_job_calls = 4
max_input_tokens = 8192 # Full system + summary/evidence views + raw fragments.
input_chunk_bytes = 12000 # Secondary raw-array bound, never the full-input budget.
generation_output_tokens = 2048
recovery_output_tokens = 4096
service_hourly_token_limit = 40000
service_daily_token_limit = 200000
service_hourly_call_limit = 8
service_daily_call_limit = 48
conversation_hourly_token_limit = 20000
conversation_daily_token_limit = 80000
conversation_hourly_call_limit = 4
conversation_daily_call_limit = 24
due_scan_limit = 32
yield_delay_seconds = 1
# Rolling limits use 0 for unlimited. Work-family allowances must remain positive.
# Optional per-model pricing; unknown prices stay unknown, not zero cost.
# model_prices = [{client_name="background", model="your-model", revision="2026-10-04", input_cost_per_million=1.0, output_cost_per_million=2.0}]
# Optional independent model selection (otherwise the configured default):
# background_client_name = "background"
# background_model = "your-configured-model"
# Service-to-service import requires LKA_MESSAGES_IMPORT_TOKEN in the environment.
# Optional separate UI/control credential: LKA_MESSAGES_API_TOKEN.
# Neither credential is a NapCat token. Never send the import credential to JS.

[background]
request_timeout_seconds = 30
max_pending_jobs = 1024
max_llm_concurrency = 4
interactive_reserved = 2
memory_concurrency = 1
message_concurrency = 1
io_concurrency = 1
hourly_token_limit = 200000 # Per non-memory background pool, not shared with memory.
daily_token_limit = 1000000
memory_task_fuse_tokens = 262144 # Emergency stop, not a routine quota; must be positive.
memory_hourly_fuse_tokens = 2000000
memory_daily_fuse_tokens = 10000000
# Monetary limits are opt-in, with configured prices; usage always records tokens.
daily_cost_limit = 0
input_cost_per_million = 0
output_cost_per_million = 0

[reranker]
# Rerank the locally recalled candidate pool before selecting top-k. Keep
# local_files_only=true: a missing model falls back to retrieval order with a warning.
# Download the model explicitly to cache_dir before deployment for full quality.
enabled = true
model_name = "BAAI/bge-reranker-base"
cache_dir = "./data/runtime/models"
batch_size = 8
max_candidates = 30
max_query_chars = 1000
max_candidate_chars = 1800
max_concurrent_inferences = 1
queue_timeout_ms = 25
local_files_only = true
